<div x-data="{ clicks: 0 }">
    <button x-bind="SomeButton">Click</button>
    <span x-text="clicks"></span>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.bind('SomeButton', () => ({
            type: 'button',
            '@click'() {
                this.clicks++
            },
            ':disabled'() {
                return this.clicks >= 3
            },
        }))
    })
</script>
